name: pit-crypto-v2-canary
services:
  pit-v2-db:
    image: postgres@sha256:43f9275df91e012c3da3d86bea5d7bb5e67a473296cc906c5f9e80b8176b1a37
    environment:
      POSTGRES_DB: pit_crypto_v2
      POSTGRES_USER: pit_v2_api
      POSTGRES_PASSWORD: ${PIT_V2_DB_PASSWORD:?separate V2 database password required}
    volumes: [pit-v2-db-data:/var/lib/postgresql/data]
    networks: [pit-v2-data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U pit_v2_api -d pit_crypto_v2"], interval: 15s, timeout: 3s, retries: 3}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    labels: [traefik.enable=false]
    restart: unless-stopped
  pit-v2-migrate:
    image: ${PIT_V2_IMAGE:?immutable V2 GHCR digest required}
    command: ["migrate"]
    # Docker's default is already no restart. Coolify 4.7.5 also uses this
    # explicit value to exclude the successful one-shot job from app health.
    restart: "no"
    environment:
      PIT_DATABASE_URL: ${PIT_V2_DATABASE_URL:?separate V2 database URL required}
      PIT_BACKEND_INVITE_SHA256: ${PIT_V2_BACKEND_INVITE_SHA256:?V2 invite hash required}
      PIT_EDGE_HMAC_KEY: ${PIT_V2_EDGE_HMAC_KEY:?V2 gateway secret required}
      PIT_ALLOWED_ORIGIN: ${PIT_V2_ALLOWED_ORIGIN:?private V2 origin required}
    depends_on: {pit-v2-db: {condition: service_healthy}}
    networks: [pit-v2-data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 50
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: [traefik.enable=false]
  pit-v2-api:
    image: ${PIT_V2_IMAGE:?immutable V2 GHCR digest required}
    command: ["api"]
    environment:
      PIT_DATABASE_URL: ${PIT_V2_DATABASE_URL:?separate V2 database URL required}
      PIT_BACKEND_INVITE_SHA256: ${PIT_V2_BACKEND_INVITE_SHA256:?V2 invite hash required}
      PIT_EDGE_HMAC_KEY: ${PIT_V2_EDGE_HMAC_KEY:?V2 gateway secret required}
      PIT_ALLOWED_ORIGIN: ${PIT_V2_ALLOWED_ORIGIN:?private V2 origin required}
      PIT_NFT_FETCH_ENABLED: "0"
      PIT_API_PORT: "8789"
    depends_on: {pit-v2-migrate: {condition: service_completed_successfully}}
    networks: [pit-v2-data,pit-v2-rpc]
    healthcheck: {test: ["CMD", "/usr/local/bin/pit-crypto-backend-v2", "api-health"], interval: 30s, timeout: 5s, start_period: 30s, retries: 3}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 80
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: [traefik.enable=false]
    restart: unless-stopped
    stop_grace_period: 15s
  pit-v2-worker:
    image: ${PIT_V2_IMAGE:?immutable V2 GHCR digest required}
    command: ["worker"]
    environment:
      PIT_DATABASE_URL: ${PIT_V2_DATABASE_URL:?separate V2 database URL required}
      PIT_BACKEND_INVITE_SHA256: ${PIT_V2_BACKEND_INVITE_SHA256:?V2 invite hash required}
      PIT_EDGE_HMAC_KEY: ${PIT_V2_EDGE_HMAC_KEY:?V2 gateway secret required}
      PIT_ALLOWED_ORIGIN: ${PIT_V2_ALLOWED_ORIGIN:?private V2 origin required}
      PIT_NFT_FETCH_ENABLED: "0"
    depends_on: {pit-v2-migrate: {condition: service_completed_successfully}}
    networks: [pit-v2-data,pit-v2-rpc]
    healthcheck: {test: ["CMD", "/usr/local/bin/pit-crypto-backend-v2", "worker-health"], interval: 30s, timeout: 5s, start_period: 30s, retries: 3}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 80
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    labels: [traefik.enable=false]
    restart: unless-stopped
    stop_grace_period: 30s
networks:
  pit-v2-data: {internal: true}
  pit-v2-rpc: {}
volumes:
  pit-v2-db-data: {}
