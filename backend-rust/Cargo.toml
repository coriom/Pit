[package]
name = "pit-crypto-backend-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
alloy = { version = "=2.5.0", default-features = false, features = ["provider-http", "rpc-types", "sol-types", "reqwest-rustls-tls"] }
alloy-dyn-abi = "=1.7.3"
alloy-json-abi = "=1.7.3"
axum = { version = "=0.8.9", features = ["macros"] }
chrono = { version = "=0.4.45", features = ["serde"] }
csv = "=1.4.0"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.43"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.29.2", features = ["serde", "v4"] }

[dev-dependencies]
tower = "=0.5.2"
