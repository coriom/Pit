name: Publish PIT backend image (manual)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build, SBOM and vulnerability review
        run: |
          set -euo pipefail
          mkdir -p artifacts
          image="ghcr.io/coriom/pit-backend:${GITHUB_SHA}"
          docker build --pull=false --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" -f backend/Dockerfile backend
          (cd backend && npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx) > artifacts/backend-sbom.json
          docker save "$image" -o artifacts/backend-image.tar
          docker run --rm --mount "type=bind,src=${PWD}/artifacts,dst=/work" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /work/backend-image.tar --scanners vuln --severity HIGH,CRITICAL \
            --format json --no-progress --output /work/trivy.json
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")] | length == 0' artifacts/trivy.json
          rm artifacts/backend-image.tar
      - name: Publish immutable source tag
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/coriom/pit-backend:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker buildx imagetools inspect "$image" > artifacts/registry-inspection.txt
          digest="$(sed -n 's/^Digest:[[:space:]]*//p' artifacts/registry-inspection.txt | head -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' 'ghcr.io/coriom/pit-backend' "$digest" > artifacts/image-digest.txt
          cat artifacts/image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pit-backend-image-${{ github.sha }}
          path: |
            artifacts/backend-sbom.json
            artifacts/trivy.json
            artifacts/registry-inspection.txt
            artifacts/image-digest.txt
          if-no-files-found: warn
          retention-days: 14
