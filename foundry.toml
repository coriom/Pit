[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
libs = ["node_modules"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 100
